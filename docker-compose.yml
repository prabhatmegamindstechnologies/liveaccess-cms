# Local PostgreSQL for CMS development and tests. Not used by the live site.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: liveaccess
      POSTGRES_PASSWORD: liveaccess_dev
      POSTGRES_DB: liveaccess
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./cms/db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liveaccess -d liveaccess"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
